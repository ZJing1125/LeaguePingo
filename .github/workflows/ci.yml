name: CI

on:
  push:
    branches: [dev]
    paths-ignore:
      - 'website/**'
      - '.github/workflows/website.yml'
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      upload_exe:
        description: 上传 dev 测试下载包（自动推送构建无需勾选）
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  # 测试通过 BROWSER_EXECUTABLE 使用系统 Edge/Chrome，不需要 Playwright 自带浏览器。
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  # 第一关：Linux 快速检查。失败就不再启动更贵的 Windows 任务。
  portable:
    name: Portable checks (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies (locked)
        run: npm --prefix frontend ci

      # 内容：workflow 策略检查、脚本测试、前端单元测试 + vue-tsc + 生产构建、
      # go test/vet ./internal/...、git diff --check
      - name: Portable verification
        run: bash scripts/verify.sh portable

  # 三项质量检查全部成功后才允许 Windows 验证和构建。
  # 目标仍按 Windows 构建解析；工具固定在兼容 go.mod Go 1.26 的版本，
  # GOTOOLCHAIN=local 防止分析器静默下载另一套 Go。
  quality:
    name: Quality checks
    needs: portable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Each job has its own checkout. Go embeds frontend/dist from this job,
      # so the portable job's build cannot supply staticcheck's inputs.
      - name: Prepare embedded frontend for analyzers
        id: frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Install pinned analyzers
        id: analyzers
        run: |
          tool_bin="$RUNNER_TEMP/quality-bin"
          GOBIN="$tool_bin" go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          GOBIN="$tool_bin" go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          echo "$tool_bin" >> "$GITHUB_PATH"

      - name: Staticcheck
        id: staticcheck
        if: ${{ !cancelled() && steps.frontend.outcome == 'success' && steps.analyzers.outcome == 'success' }}
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: staticcheck ./...

      - name: Govulncheck
        id: govulncheck
        if: ${{ !cancelled() && steps.frontend.outcome == 'success' && steps.analyzers.outcome == 'success' }}
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: govulncheck ./...

      - name: npm audit
        id: npm_audit
        if: ${{ !cancelled() && steps.frontend.outcome == 'success' }}
        run: npm --prefix frontend audit --audit-level=high

      - name: Publish quality summary
        id: summary
        if: always()
        run: |
          {
            echo "### Required quality checks"
            echo "| Check | Outcome |"
            echo "| --- | --- |"
            echo "| staticcheck | ${{ steps.staticcheck.outcome }} |"
            echo "| govulncheck | ${{ steps.govulncheck.outcome }} |"
            echo "| npm audit | ${{ steps.npm_audit.outcome }} |"
            echo
            echo "All three checks must succeed before Windows verification and build."
          } >> "$GITHUB_STEP_SUMMARY"

  # 第二关：Windows 完整验证 + 编译。只验证自动化部分，不等于真实国服客户端验收。
  windows:
    name: Windows verify and build
    needs: [portable, quality]
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      download_name: ${{ steps.bundle.outputs.artifact_name }}
    defaults:
      run:
        shell: bash
    steps:
      # 必须在 checkout 之前设置，避免脚本被转成 CRLF。
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        id: go
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Wails CLI 版本直接取 go.mod，保证与后端依赖一致（verify.sh 也会校验前后端版本相同）。
      - name: Resolve Wails version and tool paths
        id: wails
        run: |
          version=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          gobin=$(cygpath -m "$(go env GOPATH)/bin")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "gobin=$gobin" >> "$GITHUB_OUTPUT"
          echo "$(cygpath -w "$gobin")" >> "$GITHUB_PATH"

      - name: Cache Wails CLI
        id: wails-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.wails.outputs.gobin }}/wails3.exe
          key: wails3-${{ runner.os }}-${{ steps.wails.outputs.version }}-go${{ steps.go.outputs.go-version }}

      - name: Install Wails CLI
        if: steps.wails-cache.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ steps.wails.outputs.version }}

      - name: Install frontend dependencies (locked)
        run: npm --prefix frontend ci

      # 使用 windows-latest 自带的 Edge；找不到时脚本会明确报错，不会静默跳过。
      - name: Locate browser for Playwright tests
        run: |
          browser=$(node scripts/environment.mjs browser)
          echo "Using browser: $browser"
          echo "BROWSER_EXECUTABLE=$browser" >> "$GITHUB_ENV"

      - name: Install pinned NSIS packaging tool
        run: choco install nsis --version=3.13.0 --no-progress --yes --limit-output

      # build.sh 内含：environment/check/audit → verify.sh（生成绑定、前端构建、syso、
      # go test ./...、go vet ./...、Playwright 烟测）→ 编译 → sha256 → 登记产物。
      - name: Verify and build (scripts/build.sh)
        run: bash scripts/build.sh bin/leaguepingo-ci.exe

      - name: Package NSIS installer
        timeout-minutes: 5
        run: bash scripts/package-windows.sh --binary bin/leaguepingo-ci.exe --output artifacts/installer-check/leaguepingo-ci-installer.exe

      - name: Verify NSIS install and uninstall
        timeout-minutes: 3
        run: bash scripts/verify-installer.sh artifacts/installer-check/leaguepingo-ci-installer.exe

      # 提交的 TS 绑定必须与 Go 接口一致（包含未跟踪的新文件）。
      - name: Check generated bindings are committed
        run: |
          if [ -n "$(git status --porcelain -- frontend/bindings)" ]; then
            git status --short -- frontend/bindings
            echo "::error::frontend/bindings 与 Go 接口不一致，请本地运行 wails3 generate bindings -clean=true -ts -i 后提交"
            exit 1
          fi

      # 构建成功时 build.sh 会把界面截图放在 artifacts/leaguepingo-ci/ 下。
      # 构建失败时 build.sh 会清理残留，目录可能为空，此时以任务日志为准。
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-screenshots
          path: artifacts/leaguepingo-ci/
          if-no-files-found: ignore
          retention-days: 7

      # 成功的 dev 推送自动提供测试下载；PR 只验证，手动运行仍可选择上传。
      - name: Prepare development download
        id: bundle
        if: ${{ success() && github.ref == 'refs/heads/dev' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.upload_exe)) }}
        run: node scripts/ci-download.mjs

      - name: Upload development download
        id: download
        if: ${{ success() && github.ref == 'refs/heads/dev' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.upload_exe)) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.bundle.outputs.artifact_name }}
          path: artifacts/ci-download/
          if-no-files-found: error
          retention-days: 14

      - name: Publish download link
        if: ${{ success() && steps.download.outcome == 'success' }}
        env:
          DOWNLOAD_URL: ${{ steps.download.outputs.artifact-url }}
        run: |
          {
            echo "### Windows 开发测试版"
            echo "[下载本次迭代 ZIP]($DOWNLOAD_URL)（登录 GitHub 后下载，保留 14 天）"
            echo
            echo "解压后退出旧版助手，再运行 leaguepingo.exe；也可用 leaguepingo-setup.exe 安装。"
            echo "无需 Go、Node 或 Wails。提交和校验值见 BUILD-INFO.json、SHA256SUMS.txt。"
            echo "此包已通过自动化验证；真实客户端功能仍需本机验收。"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish development release
    needs: [portable, quality, windows]
    if: ${{ success() && github.ref == 'refs/heads/dev' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.upload_exe)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Download verified Windows bundle
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ needs.windows.outputs.download_name }}
        run: |
          test -n "$ARTIFACT_NAME"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir artifacts/release
      - name: Verify assets and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs

  website:
    name: Update download website
    needs: release
    if: ${{ success() && github.ref == 'refs/heads/dev' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/website.yml
