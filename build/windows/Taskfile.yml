version: '3'

# Only managed delivery and isolated hot reload are active.
tasks:
  build:
    summary: Managed Windows delivery build
    cmds:
      - bash scripts/build.sh
    env:
      LEAGUEPINGO_TASK_OS: '{{.GOOS | default "windows"}}'
      LEAGUEPINGO_TASK_ARCH: '{{.ARCH | default "amd64"}}'
      LEAGUEPINGO_TASK_DEV: '{{.DEV | default "false"}}'
      LEAGUEPINGO_TASK_TAGS: '{{.EXTRA_TAGS}}'
      LEAGUEPINGO_TASK_OBFUSCATED: '{{.OBFUSCATED | default "false"}}'

  run:
    summary: Audit and run the current managed delivery binary
    cmds:
      - bash scripts/run.sh

  dev:build:
    summary: Isolated hot-reload compilation (never a delivery)
    cmds:
      - bash scripts/dev.sh build

  dev:run:
    summary: Run the isolated hot-reload output
    cmds:
      - bash scripts/dev.sh run

  unsupported:
    internal: true
    cmds:
      - node scripts/workflow.mjs unsupported

  build:native:
    cmds:
      - task: unsupported
  build:docker:
    cmds:
      - task: unsupported
  package:
    cmds:
      - task: unsupported
  create:nsis:installer:
    cmds:
      - task: unsupported
  create:msix:package:
    cmds:
      - task: unsupported
  install:msix:tools:
    cmds:
      - task: unsupported
  sign:
    cmds:
      - task: unsupported
  sign:installer:
    cmds:
      - task: unsupported
