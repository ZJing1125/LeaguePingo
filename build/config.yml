# This file contains the configuration for this project.
# Build assets are maintained for Windows and the future macOS target only.
# Review changes in an isolated directory when updating Wails templates;
# a full regeneration here would restore removed platforms and overwrite tasks.
version: '3'

# This information is used to generate the build assets.
info:
  companyName: "LeaguePingo"
  productName: "LeaguePingo"
  productIdentifier: "io.github.zjing1125.leaguepingo"
  description: "League of Legends match history companion"
  copyright: "© 2026 LeaguePingo contributors"
  comments: "Local-first match history companion prototype"
  version: "0.2.0"
  # cfBundleIconName: "appicon" # The macOS icon name in Assets.car icon bundles (optional)
  #                               # Should match the name of your .icon file without the extension
  #                               # If not set and Assets.car exists, defaults to "appicon"

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
      - artifacts
      - .tools
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js" # Watch for changes to JS/TS files included using the //wails:include directive.
      - "*.ts" # The frontend directory will be excluded entirely by the setting above.
    git_ignore: true
  executes:
    - cmd: wails3 task windows:dev:build
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
      # The standard frontend task waits up to 60s for HTTP 200 from
      # FRONTEND_DEVSERVER_URL before starting the app. Override if needed;
      # custom background commands can opt in with the same readiness block.
      # readiness:
      #   http: "http://localhost:5173/"
      #   timeout: "60s"
      #   interval: "200ms"
    - cmd: wails3 task windows:dev:run
      type: primary
      exit_policy: shutdown

# File Associations
# More information at: https://v3.wails.io/noit/done/yet
fileAssociations:
